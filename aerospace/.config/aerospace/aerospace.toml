# Omarchy-inspired tiling, based on
# https://www.eddiedale.com/blog/my-mac-tiling-setup-inspired-by-omarchy
#
# Omarchy's Super key maps to:
#   cmd / cmd+shift   terminal, browser, workspaces and the main apps
#   cmd+ctrl          every other Super binding
#   cmd+ctrl+shift    every Super+Shift binding
# This leaves cmd+W, cmd+T, cmd+F and friends to the apps.

config-version = 2

start-at-login = true

persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

# SketchyBar and JankyBorders run as brew services, so nothing to start here
after-startup-command = []

# Tell SketchyBar which workspace is focused
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

key-mapping.preset = 'qwerty'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Omarchy uses 5px inner and 10px outer gaps. On the built-in notch display
# macOS already reserves the 38px strip SketchyBar sits in, so only a normal
# gap is needed there. Other displays need room for the 38px bar plus the gap.
[gaps]
inner.horizontal = 10
inner.vertical   = 10
outer.left       = 10
outer.bottom     = 10
outer.top        = [{ monitor.built-in = 10 }, 48]
outer.right      = 10

# 1 to 5 live on the external display and 6 to 9 on the MacBook.
# With no external display plugged in, they all fall back to the MacBook.
[workspace-to-monitor-force-assignment]
1 = ['secondary', 'built-in']
2 = ['secondary', 'built-in']
3 = ['secondary', 'built-in']
4 = ['secondary', 'built-in']
5 = ['secondary', 'built-in']
6 = 'built-in'
7 = 'built-in'
8 = 'built-in'
9 = 'built-in'

[mode.main.binding]

    # Terminal (Omarchy: Super+Enter). cmd+ctrl+Enter jumps to an existing one.
    cmd-enter      = 'exec-and-forget ~/.config/aerospace/new-terminal.sh'
    cmd-ctrl-enter = 'exec-and-forget ~/.config/aerospace/app.sh com.mitchellh.ghostty'

    # Apps (Omarchy: Super+Shift+letter)
    cmd-shift-enter      = 'exec-and-forget ~/.config/aerospace/app.sh net.imput.helium'
    cmd-ctrl-shift-b     = 'exec-and-forget ~/.config/aerospace/app.sh net.imput.helium'
    cmd-ctrl-alt-shift-b = 'exec-and-forget open -na Helium --args --incognito'
    cmd-shift-f          = 'exec-and-forget ~/.config/aerospace/app.sh com.apple.finder'
    cmd-shift-n          = 'exec-and-forget ~/.config/aerospace/app.sh dev.zed.Zed'
    cmd-shift-o          = 'exec-and-forget ~/.config/aerospace/app.sh md.obsidian'
    cmd-shift-g          = 'exec-and-forget ~/.config/aerospace/app.sh com.github.GitHubClient'
    cmd-shift-b          = 'exec-and-forget ~/.config/aerospace/app.sh be.spatie.bloom'
    cmd-shift-m          = 'exec-and-forget ~/.config/aerospace/app.sh com.spotify.client'
    cmd-ctrl-shift-d     = 'exec-and-forget ~/.config/aerospace/app.sh com.tinyapp.TablePlus'
    cmd-ctrl-shift-h     = 'exec-and-forget ~/.config/aerospace/app.sh de.beyondco.herd'
    cmd-ctrl-shift-i     = 'exec-and-forget ~/.config/aerospace/app.sh com.jetbrains.PhpStorm'
    cmd-ctrl-shift-t     = 'exec-and-forget ~/.config/aerospace/app.sh com.apple.ActivityMonitor'

    # Web apps (Omarchy: Super+Shift+letter)
    cmd-ctrl-shift-a     = 'exec-and-forget ~/.config/aerospace/webapp.sh https://claude.ai'
    cmd-ctrl-shift-c     = 'exec-and-forget ~/.config/aerospace/webapp.sh https://calendar.google.com'
    cmd-ctrl-shift-e     = 'exec-and-forget ~/.config/aerospace/webapp.sh https://mail.google.com'
    cmd-ctrl-shift-y     = 'exec-and-forget ~/.config/aerospace/webapp.sh https://youtube.com'
    cmd-ctrl-shift-x     = 'exec-and-forget ~/.config/aerospace/webapp.sh https://x.com'
    cmd-ctrl-shift-p     = 'exec-and-forget ~/.config/aerospace/webapp.sh https://photos.google.com'
    cmd-ctrl-shift-s     = 'exec-and-forget ~/.config/aerospace/webapp.sh https://maps.google.com'
    cmd-ctrl-alt-shift-g = 'exec-and-forget ~/.config/aerospace/webapp.sh https://web.whatsapp.com'

    # Screenshots with Shottr (Omarchy: Super+Ctrl+C capture)
    cmd-ctrl-c     = 'exec-and-forget open -g shottr://grab/area'
    cmd-ctrl-alt-c = 'exec-and-forget open -g shottr://grab/fullscreen'

    # Show this keybinding cheat sheet (Omarchy: Super+K)
    cmd-ctrl-k = 'exec-and-forget open -a TextEdit ~/.config/aerospace/keybindings.txt'

    # Window management (Omarchy: Super+letter)
    cmd-ctrl-w = 'close'
    cmd-ctrl-f = 'fullscreen --no-outer-gaps'
    cmd-ctrl-alt-f = 'fullscreen'
    cmd-ctrl-t = 'layout floating tiling'
    cmd-ctrl-j = 'layout horizontal vertical'
    cmd-ctrl-g = 'layout accordion tiles'

    # Focus (Omarchy: Super+arrows)
    cmd-ctrl-left  = 'focus --boundaries-action wrap-around-the-workspace left'
    cmd-ctrl-down  = 'focus --boundaries-action wrap-around-the-workspace down'
    cmd-ctrl-up    = 'focus --boundaries-action wrap-around-the-workspace up'
    cmd-ctrl-right = 'focus --boundaries-action wrap-around-the-workspace right'

    # Swap windows (Omarchy: Super+Shift+arrows)
    cmd-ctrl-shift-left  = 'move left'
    cmd-ctrl-shift-down  = 'move down'
    cmd-ctrl-shift-up    = 'move up'
    cmd-ctrl-shift-right = 'move right'

    # Send the window to the other display, and follow it
    cmd-ctrl-alt-left  = 'move-node-to-monitor --focus-follows-window --wrap-around prev'
    cmd-ctrl-alt-right = 'move-node-to-monitor --focus-follows-window --wrap-around next'

    # Resize (Omarchy: Super+minus / Super+equal)
    cmd-ctrl-minus       = 'resize width -50'
    cmd-ctrl-equal       = 'resize width +50'
    cmd-ctrl-shift-minus = 'resize height -50'
    cmd-ctrl-shift-equal = 'resize height +50'

    # Switch workspace (Omarchy: Super+1-9)
    cmd-1 = 'workspace 1'
    cmd-2 = 'workspace 2'
    cmd-3 = 'workspace 3'
    cmd-4 = 'workspace 4'
    cmd-5 = 'workspace 5'
    cmd-6 = 'workspace 6'
    cmd-7 = 'workspace 7'
    cmd-8 = 'workspace 8'
    cmd-9 = 'workspace 9'

    # Move window to workspace (Omarchy: Super+Shift+1-9)
    cmd-ctrl-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
    cmd-ctrl-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
    cmd-ctrl-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
    cmd-ctrl-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
    cmd-ctrl-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
    cmd-ctrl-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
    cmd-ctrl-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
    cmd-ctrl-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
    cmd-ctrl-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'

    # Cycle through workspaces with windows (Omarchy: Super+Tab).
    # The MX Master gesture button sends these too.
    cmd-ctrl-tab       = 'exec-and-forget ~/.config/aerospace/workspace-cycle.sh next'
    cmd-ctrl-shift-tab = 'exec-and-forget ~/.config/aerospace/workspace-cycle.sh prev'

    # Reset layout, reload config
    cmd-ctrl-shift-r = ['flatten-workspace-tree', 'reload-config']

# Apps that don't tile well
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

