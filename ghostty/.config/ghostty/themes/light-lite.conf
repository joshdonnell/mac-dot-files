# Light Lite
# Based on https://github.com/brendt/phpstorm-light-lite-theme
# Colours come from Google's logo, as used in the PhpStorm scheme.
# Each colour keeps its hue but is darkened to a luminance of about 0.18, which gives at least 4.5:1 both as text on white
# and behind black text. Light themes need both, since herdr-ade draws its buttons as black text on these colours.

background = #ffffff
foreground = #222222

cursor-color = #222222
cursor-text = #ffffff

selection-background = #dddddd
selection-foreground = #222222

# Normal
# Pure black, so black text on the colours below still reaches 4.5:1.
palette = 0=#000000
palette = 1=#e4271a
palette = 2=#298642
# Scheme uses #fcbc05, darkened (same hue) so it is readable on white
palette = 3=#956f00
palette = 4=#1f6ff2
# Scheme defines no magenta/cyan, these are Google's purple and cyan
palette = 5=#a142f4
palette = 6=#0f828f
# Gray: secondary text and herdr-ade's ordinary buttons.
palette = 7=#757575

# Bright (kept equal to normal, the scheme's bright variants are near invisible on white)
# 8 is dim text (and autosuggestions) and herdr-ade's selected row, so it sits lighter than 7, the reverse of a dark theme.
palette = 8=#959595
palette = 9=#e4271a
palette = 10=#298642
palette = 11=#956f00
palette = 12=#1f6ff2
palette = 13=#a142f4
palette = 14=#0f828f
palette = 15=#dddddd

split-divider-color = #dddddd
