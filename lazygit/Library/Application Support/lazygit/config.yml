# Opened as a herdr popup with ctrl+s d. Esc at the top level quits and closes the popup.
gui:
  showCommandLog: false
  showBottomLine: false
  showPanelJumps: false
  showRandomTip: false
  showListFooter: false
  showNumstatInFilesView: true
  showFileTree: true
  sidePanelWidth: 0.3
  shrinkSidePanelsToContent: true
  expandFocusedSidePanel: true
  expandedSidePanelWeight: 8
  splitDiff: auto
  nerdFontsVersion: "3"
  tabWidth: 4

  # Narrow panes: file list on top, diff full width.
  portraitMode: auto
  portraitModeAutoMaxWidth: 110
  portraitModeAutoMinHeight: 30

  # Status, files, stash. Branches and commits are tabs on stash (press ]).
  sidePanels:
    - [status]
    - [files]
    - [stash, branches, commits]

  # Osaka Jade (Ghostty dark) and Light Lite (Ghostty light).
  theme:
    activeBorderColor: ["#2DD5B7", bold]
    searchingActiveBorderColor: ["#E5C736", bold]
    optionsTextColor: ["#75bbb3"]
    selectedLineBgColor: ["#32473B"]
    inactiveViewSelectedLineBgColor: ["#1d2e27"]
    unstagedChangesColor: ["#FF5345"]
    branchColorPatterns:
      "^main$": "#63b07a"
      "^feature/": "#2DD5B7"
      "^(hotfix|bugfix|fix)/": "#FF5345"
      "^chore/": "#75bbb3"
      "^claude/": "#E5C736"
      "^proofreader/": "#D2689C"
  lightTheme:
    activeBorderColor: ["#509475", bold]
    searchingActiveBorderColor: ["#b38600", bold]
    optionsTextColor: ["#129eaf"]
    selectedLineBgColor: ["#dddddd"]
    inactiveViewSelectedLineBgColor: ["#eeeeee"]
    unstagedChangesColor: ["#e84135"]
    branchColorPatterns:
      "^main$": "#34a853"
      "^feature/": "#509475"
      "^(hotfix|bugfix|fix)/": "#e84135"
      "^chore/": "#129eaf"
      "^claude/": "#b38600"
      "^proofreader/": "#a142f4"

git:
  log:
    showGraph: never
  autoFetch: true
  autoRefresh: true
  diffContextSize: 3
  diffRenderers:
    # Syntax colours from the terminal's ANSI palette, so they follow Ghostty. Press | to switch.
    - name: delta
      command: >-
        delta --{{colorScheme}} --paging=never --syntax-theme=ansi
        --tabs=4 --relative-paths --line-numbers
        --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
        {{if eq .colorScheme "light"}}--plus-style="syntax #e6f4ea" --plus-emph-style="syntax #c3e6cb" --minus-style="syntax #fce8e6" --minus-emph-style="syntax #f5c6c2"{{else}}--plus-style="syntax #1f3a2b" --plus-emph-style="syntax #2b5c3f" --minus-style="syntax #3d2220" --minus-emph-style="syntax #6b2f2a"{{end}}
    # Plain git with word-level colouring, for prose and markdown.
    - type: rawGit
      args: [--color-words]
      name: color-words

# Checkout by name from the files panel. Type to filter, Enter checks out.
customCommands:
  - key: b
    context: "files, status, stash"
    description: "Checkout branch"
    loadingText: "Checking out"
    prompts:
      - type: input
        title: "Checkout:"
        key: Branch
        suggestions:
          preset: branches
    command: git checkout {{.Form.Branch | quote}}

quitOnTopLevelReturn: true
disableStartupPopups: true
update:
  method: never
