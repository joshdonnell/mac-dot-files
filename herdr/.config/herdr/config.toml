onboarding = false

# Mirrors Ghostty (osaka-jade dark, light-lite light) and the Starship osaka_jade palette.
[theme]
name = "tokyo-night"
auto_switch = true
dark_name = "tokyo-night"
light_name = "tokyo-night-day"

# Osaka Jade. Shared so it is also the fallback when no appearance is reported.
[theme.custom]
accent = "#2DD5B7"         # starship jade
panel_bg = "#172520"
sidebar_bg = "reset"
active_row_bg = "#1d2e27"
selection_bg = "#32473B"   # ghostty selection-background
surface0 = "#23372E"
surface1 = "#32473B"
surface_dim = "#172520"
overlay0 = "#53685B"       # ghostty palette 8
overlay1 = "#7A8B7F"
text = "#C1C497"           # starship text
subtext0 = "#9FA384"
mauve = "#63b07a"          # starship leaf, git branch segment
green = "#549e6a"
yellow = "#E5C736"         # starship gold
red = "#FF5345"            # starship red
blue = "#75bbb3"           # starship aqua
teal = "#8CD3CB"
peach = "#db9f9c"

# Light Lite. Colours match the Ghostty light-lite palette, darkened to at least 4.5:1 on white.
[theme.custom.light]
accent = "#458066"         # starship pine, darkened
panel_bg = "#f5f5f5"
active_row_bg = "#eeeeee"
selection_bg = "#dddddd"
surface0 = "#e8e8e8"
surface1 = "#dddddd"
surface_dim = "#f0f0f0"
overlay0 = "#959595"       # ghostty palette 8
overlay1 = "#757575"       # ghostty palette 7
text = "#222222"
subtext0 = "#555555"
mauve = "#a142f4"
green = "#298642"
yellow = "#956f00"
red = "#e4271a"
blue = "#1f6ff2"
teal = "#0f828f"
peach = "#b65e0a"

[keys]
prefix = "ctrl+s"

# herdr-ade (shire-studio.ade). The sidebar takes prefix+d, so the workspace popup sits on prefix+a instead of herdr-ade's default.
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "shire-studio.ade.sidebar"
description = "toggle sidebar"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "shire-studio.ade.workspace"
description = "workspace status and actions"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "shire-studio.ade.files"
description = "find a file"

[ui]
agent_panel_sort = "priority"
prompt_new_tab_name = false
status_indicators = "dots"
copy_on_select = false

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["tab"],
]

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["branch"],
  ["$ws_status", "$ws_running"],
]
