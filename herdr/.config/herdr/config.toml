onboarding = false

# Mirrors Ghostty (osaka-jade dark, light-lite light) and the Starship osaka_jade palette.
[theme]
name = "tokyo-night"
auto_switch = true
dark_name = "tokyo-night"
light_name = "tokyo-night-day"

# Osaka Jade. Shared so it is also the fallback when no appearance is reported.
[theme.custom]
accent = "#2DD5B7"         # starship jade
panel_bg = "#172520"
sidebar_bg = "reset"
active_row_bg = "#1d2e27"
selection_bg = "#32473B"   # ghostty selection-background
surface0 = "#23372E"
surface1 = "#32473B"
surface_dim = "#172520"
overlay0 = "#53685B"       # ghostty palette 8
overlay1 = "#7A8B7F"
text = "#C1C497"           # starship text
subtext0 = "#9FA384"
mauve = "#63b07a"          # starship leaf, git branch segment
green = "#549e6a"
yellow = "#E5C736"         # starship gold
red = "#FF5345"            # starship red
blue = "#75bbb3"           # starship aqua
teal = "#8CD3CB"
peach = "#db9f9c"

# Light Lite.
[theme.custom.light]
accent = "#509475"         # starship pine, readable on white
panel_bg = "#f5f5f5"
active_row_bg = "#eeeeee"
selection_bg = "#dddddd"
surface0 = "#e8e8e8"
surface1 = "#dddddd"
surface_dim = "#f0f0f0"
overlay0 = "#aaaaaa"
overlay1 = "#777777"
text = "#222222"
subtext0 = "#555555"
mauve = "#a142f4"
green = "#34a853"
yellow = "#b38600"
red = "#e84135"
blue = "#4285f4"
teal = "#129eaf"
peach = "#d56e0c"

[keys]
prefix = "ctrl+s"

# Lazygit over the focused pane, on that pane's repo. q or Esc closes it.
[[keys.command]]
key = "prefix+d"
type = "popup"
command = "cd \"${HERDR_ACTIVE_PANE_CWD:-.}\" && exec lazygit"
description = "Git status"
width = "90%"
height = "85%"

# shire-studio/herdr-git: branch, PR, issues and Actions sidebar on the right.
[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "shire-studio.git.toggle"
description = "Toggle git sidebar"

[ui]
agent_panel_sort = "priority"
prompt_new_tab_name = false
status_indicators = "dots"
copy_on_select = false

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["tab"],
]

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["branch"],
]
