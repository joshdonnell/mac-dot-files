# herdr-ade settings. Only what differs from, or pins, its defaults (see config.example.toml in shire-studio/herdr-ade).
# Having this file also stops setup opening on first use. Keys live in ~/.config/herdr/config.toml.

[git]
enabled = true
# Git opens as a popup on prefix+ctrl+g (prefix+g stays herdr's goto), out of the sidebar, and Show changes (prefix+d) lists the changed files, so the Current tab doesn't.
style = "popup"
show_changes = false

[workspaces]
enabled = true
auto_setup = true
start_dev = true
agent_command = "claude"

[files]
enabled = true

[viewer]
# The e key opens the file at the line on screen. $EDITOR isn't set, so name Zed rather than fall back to vi.
editor = "zed {path}:{line}"
