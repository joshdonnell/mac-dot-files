# herdr-ade settings. Only what differs from, or pins, its defaults (see config.example.toml in shire-studio/herdr-ade).
# Having this file also stops setup opening on first use. Keys live in ~/.config/herdr/config.toml.

[git]
enabled = true

[workspaces]
enabled = true
auto_setup = true
start_dev = true
agent_command = "claude"

[files]
enabled = true

[viewer]
# The e key opens the file at the line on screen. $EDITOR isn't set, so name PhpStorm rather than fall back to vi.
editor = "phpstorm --line {line} {path}"
