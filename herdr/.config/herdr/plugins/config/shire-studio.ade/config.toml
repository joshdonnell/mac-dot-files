# herdr-ade settings. Only what differs from, or pins, its defaults (see config.example.toml in shire-studio/herdr-ade).
# Having this file also stops setup opening on first use. Keys live in ~/.config/herdr/config.toml.

[git]
enabled = true

[workspaces]
enabled = true
auto_setup = true
start_dev = true
agent_command = "claude"

[files]
enabled = true

[viewer]
# The e key opens the file at the line on screen. That's a quick edit, so Zed (PhpStorm is for bigger work). $EDITOR isn't set, so it's named rather than falling back to vi.
editor = "zed {path}:{line}"
